<!DOCTYPE html>
<html lang=”pt-br” xmlns:th="http://thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>

	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Sistema de RH</title>

	<!-- Via CDN CSS Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

	<!-- Bootstrap para testes, apagar depois que configurar thymeleaf-->
	<link href="vaga/bootstrap/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

    <!-- Cabeçalho e Navegação -->
    <header>
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
			<div class="container-fluid">
				<a class="navbar-brand" href="/">App RH</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
					aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarNav">
					<ul class="navbar-nav">
						<li class="nav-item"><a class="nav-link active" aria-current="page" href="/">Home</a></li>
						<li class="nav-item"><a class="nav-link" href="/funcionarios">Funcionários</a></li>
						<li class="nav-item"><a class="nav-link" href="/cadastrarFuncionario">Cadastrar Funcionário</a></li>
						<li class="nav-item"><a class="nav-link" href="/vagas">Listar Vagas</a></li>
						<li class="nav-item"><a class="nav-link" href="/cadastrarVaga">Cadastrar Vaga</a></li>
					</ul>
				</div>
			</div>
		</nav>
	</header>

    <!-- Conteúdo Principal -->
    <th:block th:include="mensagemValidacao"></th:block>

		<form method="post">
			<h1>Atualizar Funcionário</h1>
			<br>

			<div class="form-group">
				<label for=""><b>Nome do funcionário:</b></label> 
                <input type="text" class="form-control" value="" name="nome" required th:attr="value = ${funcionario.nome}"/> 
                <small class="form-text text-muted"><i>* Utilize nomes e termos mais utilizados no mercado.</i></small>
			</div>

			<div class="row">
				<div class="col">
					<div class="form-group">
						<label for=""><b>Data de nascimento:</b></label> 
                        <input type="date" class="form-control" value="" name="data" required th:attr="value = ${funcionario.data}"/>
                        <small class="form-text text-muted"><i>* Data de nascimento.</i></small>
					</div>
				</div>
				<div class="col">
					<div class="form-group">
						<label for=""><b>E-mail:</b></label>
                        <input type="text" class="form-control" value="" name="email" required th:attr="value = ${funcionario.email}" />
                        <small class="form-text text-muted"><i>* email@email.com</i></small>
					</div>
				</div>
			</div>

			<button type="submit" class="btn btn-success">Atualizar Funcionário</button>
		</form>
	</div>

    <div style="height: 100px;"></div>

<!-- Rodapé -->
<div class="footer-copyright fixed-bottom bg-dark text-center py-3">
    <span class="text-light align-middle">| Sistema de RH | - © 2024 Copyright: Daniel Penelva de Andrade</span>
</div>

<!-- Via CDN Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
